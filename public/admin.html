<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Buzz App — Admin</title>
  <style>
    @font-face {
      font-family: 'Share Tech Mono';
      src: url('/fonts/ShareTechMono-Regular.woff2') format('woff2');
      font-display: block;
    }

    @property --bg-x        { syntax: '<percentage>'; inherits: false; initial-value: 30%;   }
    @property --bg-y        { syntax: '<percentage>'; inherits: false; initial-value: 25%;   }
    @property --shimmer-pos { syntax: '<percentage>'; inherits: false; initial-value: -120%; }

    :root {
      --bg:      oklch(96.5% 0.008 250);
      --surface: oklch(100%  0     0  );
      --border:  oklch(91%   0.01  250);
      --text:    oklch(17%   0.05  264);
      --muted:   oklch(53%   0.02  250);
      --buzz:    oklch(70%   0.21   35);
      --send:    oklch(62%   0.18  258);
      --green:   oklch(52%   0.17  145);
      --red:     oklch(50%   0.22   27);
      --radius:  10px;
      --shadow:
        0 1px  3px oklch(0% 0 0 / 0.04),
        0 4px 16px oklch(0% 0 0 / 0.07),
        0 8px 32px oklch(0% 0 0 / 0.05);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg:      oklch(15%  0.02  250);
        --surface: oklch(21%  0.02  255);
        --border:  oklch(32%  0.02  250);
        --text:    oklch(95%  0.008 250);
        --muted:   oklch(62%  0.015 250);
        --shadow:
          0 1px  3px oklch(0% 0 0 / 0.3),
          0 4px 16px oklch(0% 0 0 / 0.35),
          0 8px 32px oklch(0% 0 0 / 0.3);
      }
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      color: var(--text);
      color-scheme: light dark;
      background-color: var(--bg);
      background-image:
        radial-gradient(
          ellipse 70% 50% at var(--bg-x) var(--bg-y),
          color-mix(in oklch, var(--send) 14%, transparent) 0%,
          transparent 70%
        ),
        radial-gradient(
          ellipse 55% 65% at calc(100% - var(--bg-x)) calc(100% - var(--bg-y)),
          color-mix(in oklch, var(--buzz) 10%, transparent) 0%,
          transparent 70%
        );
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 2rem 1rem;
      animation: bgdrift 30s ease-in-out infinite alternate;
    }

    @keyframes bgdrift {
      from { --bg-x: 30%; --bg-y: 25%; }
      to   { --bg-x: 70%; --bg-y: 75%; }
    }

    .app {
      width: 100%;
      max-width: 560px;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    h1 {
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--text);
    }

    .conn-badge {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--muted);
    }

    .conn-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
      transition: background 0.4s ease, box-shadow 0.4s ease;
    }

    .conn-dot.connected {
      background: var(--green);
      animation: dotglow 2.5s ease-in-out infinite;
    }
    @keyframes dotglow {
      0%, 100% { box-shadow: 0 0 0 0px color-mix(in oklch, var(--green) 45%, transparent); }
      50%      { box-shadow: 0 0 0 5px color-mix(in oklch, var(--green) 20%, transparent); }
    }

    .conn-dot.connecting {
      background: oklch(75% 0.17 75);
      animation: dotpulse 1s ease-in-out infinite;
    }
    @keyframes dotpulse {
      0%, 100% { opacity: 1;    }
      50%      { opacity: 0.25; }
    }

    .conn-dot.disconnected { background: var(--red); }

    .card {
      background:
        linear-gradient(var(--surface), var(--surface)) padding-box,
        linear-gradient(
          135deg,
          color-mix(in oklch, var(--send) 35%, transparent),
          color-mix(in oklch, var(--border) 90%, transparent) 45%,
          color-mix(in oklch, var(--buzz)  22%, transparent)
        ) border-box;
      border: 1.5px solid transparent;
      border-radius: var(--radius);
      padding: 1.5rem;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      gap: 1rem;
      contain: layout style;
    }

    input[type="text"] {
      width: 100%;
      padding: 0.6rem 0.85rem;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      font-size: 0.95rem;
      color: var(--text);
      background: var(--surface);
      outline: none;
      caret-color: var(--send);
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    input[type="text"]:focus-visible {
      border-color: var(--send);
      box-shadow: 0 0 0 3px color-mix(in oklch, var(--send) 20%, transparent);
    }

    input[type="text"]::placeholder { color: var(--muted); }

    .btn {
      padding: 0.65rem 0.75rem;
      border: none;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      touch-action: manipulation;
      transition:
        filter 0.15s ease,
        transform 0.38s linear(0, 0.5 20%, 1.05 55%, 0.97 75%, 1);
    }

    .btn::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(
        105deg,
        transparent 30%,
        rgba(255 255 255 / 0.28) 50%,
        transparent 70%
      );
      translate: var(--shimmer-pos) 0;
      pointer-events: none;
    }

    @media (hover: hover) {
      .btn:hover:not(:disabled) { filter: brightness(1.09); }
      .btn:hover::after {
        --shimmer-pos: 120%;
        transition: --shimmer-pos 0.55s ease;
      }
    }

    .btn:active:not(:disabled) {
      transform: scale(0.96);
      transition: filter 0.05s ease, transform 0.1s ease-out;
    }

    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-send { background: var(--send); color: #fff; }

    /* ── Thread ── */
    .thread-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .log-title {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
    }

    .unread-badge {
      font-size: 0.75rem;
      font-weight: 600;
      background: var(--buzz);
      color: #fff;
      padding: 0.15rem 0.5rem;
      border-radius: 99px;
    }

    .thread-list {
      list-style: none;
      max-height: 420px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      padding-right: 4px;
      overscroll-behavior: contain;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }
    .thread-list::-webkit-scrollbar       { width: 4px; }
    .thread-list::-webkit-scrollbar-track { background: transparent; }
    .thread-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    .bubble {
      display: flex;
      flex-direction: column;
      max-width: 85%;
      padding: 0.5rem 0.75rem;
      border-radius: 12px;
      font-size: 0.88rem;
      line-height: 1.4;
      opacity: 1;
      transform: translateY(0);
      transition: opacity 0.22s ease, transform 0.22s ease;
    }
    @starting-style {
      .bubble { opacity: 0; transform: translateY(4px); }
    }

    /* Son's messages — left-aligned, blue tint */
    .bubble.bubble-in {
      align-self: flex-start;
      background: color-mix(in oklch, var(--send) 11%, var(--surface));
      border-bottom-left-radius: 4px;
    }

    /* Dad's replies — right-aligned, orange tint */
    .bubble.bubble-out {
      align-self: flex-end;
      background: color-mix(in oklch, var(--buzz) 11%, var(--surface));
      border-bottom-right-radius: 4px;
    }

    /* System notes — centered, muted */
    .bubble.bubble-system {
      align-self: center;
      background: color-mix(in oklch, var(--muted) 7%, var(--surface));
      font-size: 0.78rem;
      color: var(--muted);
      border-radius: 8px;
      max-width: 100%;
      text-align: center;
    }

    .bubble-meta {
      font-size: 0.72rem;
      color: var(--muted);
      margin-top: 0.2rem;
      display: flex;
      gap: 0.4rem;
      align-items: center;
    }
    .bubble-in  .bubble-meta { justify-content: flex-start; }
    .bubble-out .bubble-meta { justify-content: flex-end; }

    .read-receipt { color: var(--green); }

    .thread-empty {
      font-size: 0.84rem;
      color: var(--muted);
      text-align: center;
      padding: 1.25rem 0;
    }

    /* ── Reply input row ── */
    .reply-row {
      display: flex;
      gap: 0.75rem;
    }
    .reply-row input { flex: 1; }
    .reply-row .btn  { flex: 0 0 auto; width: auto; padding: 0.65rem 1.25rem; }

    @media (prefers-reduced-motion: reduce) {
      body     { animation: none; }
      .bubble  { transition: none; }
      .conn-dot.connected  { animation: none; }
      .conn-dot.connecting { animation: none; }
      .btn     { transition: filter 0.15s ease; }
      .btn::after { display: none; }
    }
  </style>
</head>
<body>
  <div class="app">

    <header>
      <h1>Dad's Panel</h1>
      <div class="conn-badge" role="status" aria-live="polite" aria-label="Connection status">
        <span id="conn-dot" class="conn-dot disconnected" aria-hidden="true"></span>
        <span id="conn-label">Disconnected</span>
      </div>
    </header>

    <div class="card">
      <div class="thread-header">
        <span class="log-title">Conversation</span>
        <span id="unread-badge" class="unread-badge" hidden>0 unread</span>
      </div>
      <ul id="thread-list" class="thread-list" aria-live="polite" aria-label="Message thread">
        <li class="thread-empty" id="thread-empty">No messages yet.</li>
      </ul>
    </div>

    <div class="card">
      <div class="reply-row">
        <input type="text" id="reply-input" placeholder="Type a reply…"
               autocomplete="off" maxlength="500" />
        <button id="btn-reply" class="btn btn-send" disabled>Send</button>
      </div>
    </div>

  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script type="module" src="admin.js" defer></script>
</body>
</html>
